plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id
base { archivesName = "riffedcheats-neoforge-${minecraft_version}" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    runs {
        client { client() }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

repositories { mavenCentral() }

dependencies {
    // NeoForge already ships SpongePowered Mixin. Only if the compiler complains that
    // "org.spongepowered.asm.mixin" does not exist, uncomment the next two lines:
    // compileOnly 'org.spongepowered:mixin:0.8.5'   (and add maven { url 'https://repo.spongepowered.org/repository/maven-public/' } to repositories)
}

tasks.withType(ProcessResources).configureEach {
    var props = [mod_id: mod_id, mod_version: mod_version]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml']) { expand props }
}
